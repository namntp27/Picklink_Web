<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081d24" />
      <stop offset="100%" stop-color="#0b2228" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Brand container rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="18" ry="18" fill="url(#brandBg)" stroke="#143f34" stroke-width="1.2" />
  <!-- Vibrant glowing lime pickleball center -->
  <circle cx="32" cy="32" r="14" fill="#e2ff57" filter="url(#neonGlow)" />
  <!-- Subtle dark inner ring contour -->
  <circle cx="32" cy="32" r="8" fill="none" stroke="#0b2228" stroke-width="2.2" stroke-opacity="0.38" />
</svg>
